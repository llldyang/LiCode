[project]
name = "Licode"
version = "0.1.0"
description = "终端 AI 编程助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6",
  "rich>=13",
  "textual>=0.80",
]

[project.scripts]
Licode = "Licode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/Licode"]

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
  "types-PyYAML>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
